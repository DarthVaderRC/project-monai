name: cursor-kit-sync

# Keep the Cursor onboarding kit honest: fail if Source-of-truth paths drift
# or if intensity transforms reintroduce deprecated APIs.
#
# Requires read access to DarthVaderRC/cursor-play (private): set repository
# secret CURSOR_PLATFORM_READ_TOKEN (PAT with contents:read). See PRODUCTIZATION.md.
on:
  push:
    paths:
      - ".cursor/**"
      - "docs/cursor-kit/**"
      - "AGENTS.md"
      - "monai/transforms/intensity/**"
      - "tests/transforms/**"
      - "monai/losses/**"
      - "monai/metrics/**"
      - "monai/networks/blocks/**"
      - "tests/losses/**"
      - "tests/metrics/**"
      - "tests/networks/blocks/**"
      - ".github/workflows/cursor-kit-sync.yml"
  pull_request:
    paths:
      - ".cursor/**"
      - "docs/cursor-kit/**"
      - "AGENTS.md"
      - "monai/transforms/intensity/**"
      - "tests/transforms/**"
      - "monai/losses/**"
      - "monai/metrics/**"
      - "monai/networks/blocks/**"
      - "tests/losses/**"
      - "tests/metrics/**"
      - "tests/networks/blocks/**"
      - ".github/workflows/cursor-kit-sync.yml"

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Branch pin for demo (productization-plugin-monorepo). Tighten later to SHA/tag.
      - name: Checkout platform plugins
        uses: actions/checkout@v4
        with:
          repository: DarthVaderRC/cursor-play
          ref: productization-plugin-monorepo
          path: .ci/cursor-platform
          token: ${{ secrets.CURSOR_PLATFORM_READ_TOKEN }}

      - name: Verify plugin tree
        run: |
          test -f .ci/cursor-platform/plugins/platform-core/scripts/sync-check.sh
          test -f .ci/cursor-platform/plugins/pack-monai/scripts/check-deprecations.sh
          test -d .ci/cursor-platform/plugins/pack-monai/refs

      - name: Run cursor-kit sync-check
        env:
          CURSOR_PROJECT_DIR: ${{ github.workspace }}
          CURSOR_PLATFORM_CORE: ${{ github.workspace }}/.ci/cursor-platform/plugins/platform-core
          CURSOR_ONBOARDING_PACK: ${{ github.workspace }}/.ci/cursor-platform/plugins/pack-monai
          CURSOR_ONBOARDING_PACK_REFS: ${{ github.workspace }}/.ci/cursor-platform/plugins/pack-monai/refs
        run: bash docs/cursor-kit/scripts/sync-check.sh

      - name: Deprecated-API gate (kit packs + their tests)
        env:
          CURSOR_PROJECT_DIR: ${{ github.workspace }}
          CURSOR_ONBOARDING_PACK: ${{ github.workspace }}/.ci/cursor-platform/plugins/pack-monai
        run: |
          bash docs/cursor-kit/scripts/check-deprecations.sh \
            $(git ls-files \
              'monai/transforms/intensity/*.py' 'tests/transforms/test_*.py' \
              'monai/losses/*.py' 'tests/losses/test_*.py' \
              'monai/metrics/*.py' 'tests/metrics/test_*.py' \
              'monai/networks/blocks/*.py' 'tests/networks/blocks/test_*.py')
